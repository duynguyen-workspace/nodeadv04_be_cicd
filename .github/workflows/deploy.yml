name: Deploy VPS # đặt tên cho workflow

on:
  push:
    branches: # Workflow này sẽ được kích hoạt khi có một commit được push lên nhánh main.
      - main

jobs: # định nghĩa job sẽ thực hiện
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_KEY }}
        script: |
          cd ./nodeadv04_be_cicd
          git pull
          # docker build . -t cicd
          # docker stop cicd 
          # docker rm cicd
          # docker run -d -p 8081:8080 --name cicd --net nodeadv-net cicd

          docker-compose down
          docker-compose build
          docker-compose up -d
          docker images -f "dangling=true" -q | xargs docker rmi
